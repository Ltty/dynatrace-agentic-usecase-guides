# TEMPLATE — copy this folder to scenarios/<your-id>/ and fill in every field.
# Rename this file to scenario.yaml and remove this comment block.
# Run: python tools/validate_scenarios.py scenarios/<your-id> to verify.

id: your-scenario-id          # kebab-case, must match the parent directory name
title: "Human-readable title shown in /demo list"
source_guide: "00000000-0000-0000-0000-000000000000"  # UUID from the originating video guide JSON
duration_minutes: [8, 15]

persona:
  role: "On-call SRE pairing with the user"
  register: "calm, concrete, mild time pressure; never breathless"

scope:
  services:
    - SERVICE-XXXXXXXXXXXXXXXX   # Dynatrace service entity ID(s) relevant to this demo
  segment: ""                    # Filter segment ID (optional; "" = no segment)
  data_objects:
    - dt.davis.problems
    - spans
    - logs
    - events
  timeframe: derived_from_problem  # or last_2h | last_24h

resolve:
  problem:
    query: queries/find-problem.dql      # path relative to this scenario dir
    fallback: fixtures/problem.json      # frozen evidence for when the problem isn't live

beats:
  - id: beat-01
    source_step_id: "00000000-0000-0000-0000-000000000001"  # from source guide step id
    objective: >
      User understands the blast radius: which service failed, how many users
      were affected, and roughly when it started.
    evidence:
      - queries/beat-01-problem-summary.dql
    reveal: >
      The payment service Charge endpoint is at 100% failure rate; started 14 min ago;
      310 users affected.
    success: >
      User names the failing service OR asks to drill into payment/checkout.
    nudges: [open, narrowing, concrete, do-it-for-them]
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.davis.problems/problem/{{PROBLEM_ID}}?from={{TIMEFRAME_FROM}}&to={{TIMEFRAME_TO}}

  # Add one entry per beat. Each beat maps to one step in the source guide.
