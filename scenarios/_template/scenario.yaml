# TEMPLATE — copy this folder to scenarios/<your-id>/ and fill in every field.
# Rename this file to scenario.yaml and remove this comment block.
# Run: python tools/validate_scenarios.py scenarios/<your-id> to verify.

id: your-scenario-id          # kebab-case, must match the parent directory name
title: "Human-readable title shown in /demo list"
source_guide: "00000000-0000-0000-0000-000000000000"  # UUID from the originating video guide JSON
duration_minutes: [8, 15]

persona:
  role: "On-call SRE pairing with the user"
  register: "calm, concrete, mild time pressure; never breathless"

scope:
  services:
    - SERVICE-XXXXXXXXXXXXXXXX   # Dynatrace service entity ID(s) relevant to this demo
  segment: ""                    # Filter segment ID (optional; "" = no segment)
  data_objects:
    - dt.davis.problems
    - spans
    - logs
    - events
  timeframe: derived_from_problem  # or last_2h | last_24h

resolve:
  problem:
    query: queries/find-problem.dql      # path relative to this scenario dir

business_context:
  service_name: "your-service-name"
  avg_order_value_usd: 0
  user_action: "the action users were trying to perform"
  urgency_phrase: "impacting users right now"
  discovery_hook: >
    {affected_users} users can't {user_action} — {service_name} is {urgency_phrase}.
    ~${revenue_impact} in abandoned transactions.

beats:
  - id: beat-01
    source_step_id: "00000000-0000-0000-0000-000000000001"  # from source guide step id
    objective: >
      User understands the blast radius: which service failed, how many users
      were affected, and roughly when it started.
    evidence:
      - queries/beat-01-problem-summary.dql
    # Describe the SHAPE of the finding, never specific values — affected-user counts,
    # exception text, commit SHAs etc. all rotate between problem cycles on a recurring
    # Playground pattern. The engine reads real values from the query result at runtime.
    # See docs/AUTHORING.md.
    reveal: >
      A sharp failure-rate spike on the failing endpoint, started recently, affecting a
      large user count. State the actual numbers from the query result, not a guess.
    success: >
      User names the failing service OR asks to drill into it — an engagement signal to
      watch for, not a gate. The engine narrates its own read regardless (see
      skills/demo-engine/SKILL.md → "The beat loop").
    # objections and negative_evidence are optional — add only where the beat genuinely
    # benefits from prepared objection responses or a "no signal = the signal" finding.
    # objections:
    #   - objection: "That spike could just be a noisy metric"
    #     response: "The error rate held for 40 minutes and Davis correlated it to a deploy — not a blip."
    # negative_evidence:
    #   query: queries/beat-01-rage-clicks.dql
    #   framing: "No rage-click signal — users aren't frustrated by the UI, they're hitting a hard server error."
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.davis.problems/problem/{{PROBLEM_ID}}?from={{TIMEFRAME_FROM}}&to={{TIMEFRAME_TO}}

  # Add one entry per beat. Each beat maps to one step in the source guide.
