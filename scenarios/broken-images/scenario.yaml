id: broken-images
title: "Resolve production incidents faster: Broken product images"
source_guide: "tbd-dem-act-3"
duration_minutes: [8, 15]

business_context:
  service_name: "image service"
  user_action: "browse products"
  urgency_phrase: "If customers can't see what they're buying, they don't buy."
  discovery_hook: >
    The image service is degraded — product images are crawling for {affected_users}
    users. Response time on the image provider jumped from milliseconds to seconds
    {duration_min} minutes ago. Shoppers waiting on broken images don't finish their purchase.

persona:
  role: "On-call SRE pairing with the user"
  register: >
    Calm, concrete, mild time pressure. Speaks in facts and next steps.
    Never breathless or panicked. Uses 'we' — this is a pair exercise.
    Keeps responses tight: 2–4 sentences to set a scene, one open question.

scope:
  services:
    - SERVICE-5A0CD2879D2F37BE   # image-provider-playground in us-east-1 (root cause Lambda)
  data_objects:
    - dt.davis.problems
    - spans
    - events
    - user.sessions
    - user.events
  timeframe: derived_from_problem

resolve:
  problem:
    query: queries/find-problem.dql
    root_cause_service_id: SERVICE-5A0CD2879D2F37BE

beats:
  - id: the-page
    objective: >
      User grasps the blast radius: which service Davis pinned as root cause, how many
      users are impacted, when it started, which team owns it, and that Davis classified
      this as a response time degradation — a slowdown, not an outage: the service answers,
      just seconds late.
    evidence:
      - queries/beat-01-problem-summary.dql
    reveal: >
      A large response time degradation on the image-provider service — a Lambda that serves
      product images. Davis's description states the current response time against the
      auto-detected baseline: quote both numbers from the query result. The Astroshop frontend,
      the ingress, and a synthetic browser check for image loading are affected downstream.
      State the actual affected-user count, start time, and owning team from the query result —
      the owning-team field is live, don't say "the team," name them. Call it a slowdown, never
      a failure: image requests still return 200.
    success: >
      User identifies image-provider or the Lambda as the slow service, or asks what
      changed or why it's slow.
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.davis.problems/problem/{{PROBLEM_ID}}?from={{TIMEFRAME_FROM}}&to={{TIMEFRAME_TO}}

  - id: the-deploy
    objective: >
      User connects the slowdown to a specific change: a GitHub Actions deployment of the
      image-provider Lambda landed minutes before Davis fired, and a second commit — the fix —
      shipped before the problem closed. The commit is embedded in event.description
      (GitHub Actions doesn't populate commit/gitUrl/owner), so the query parses it.
    evidence:
      - queries/beat-02-deployment-events.dql
    reveal: >
      Typically two rows. The first commit was deployed a few minutes before the problem start
      from beat 1 and re-deployed several times (once per affected resource) — that's the
      regression. The second shipped shortly before the problem ended — that's the fix landing
      while the incident was still open. Both descriptions read alike, so tell them apart by
      timing, not text. State both SHAs, the git_url of the first, and the gap between its
      first_deploy and the problem start. The deploy events carry no owner: the owning team
      is the one named in beat 1.
    success: >
      User identifies the deployment as the trigger, extracts the commit SHA, or asks what
      that commit changed.
    objections:
      - objection: "a few minutes between the deploy and the alert doesn't prove the deploy caused it"
        response: >
          Fair — a gap that short is suggestive, not proof. The proof is in the next step:
          whether the Lambda's behaviour changed at exactly that deploy, and whether it went
          back when the fix landed. Look at what the Lambda does per request before and after.
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.deployment.management/deployments?filter=dt.entity.service%3DSERVICE-5A0CD2879D2F37BE&tf={{TIMEFRAME_FROM}}%3B{{TIMEFRAME_TO}}

  - id: the-slowdown
    objective: >
      User sees what changed in the Lambda's behaviour at the deploy: it started resizing the
      image on every request instead of serving it from S3, and latency jumped with it.
    evidence:
      - queries/beat-03-slowdown.dql
    reveal: >
      Before the regression deploy, resizes is zero — resized images are served from S3. From
      the deploy's bucket on, resizes equals requests: every single request runs the full
      resize, and the median invocation goes from tens of milliseconds to seconds. After the
      fix lands, resizes fall back to zero and latency recovers. State the actual before/after
      p50 and the buckets where it flips — that step change, lined up with both commits from
      beat 2, is the smoking gun. This pattern repeats every cycle; the numbers rotate, so read
      them from the result.
    success: >
      User connects the resizes to the deploy, or asks where the time goes.
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.services/explorer/services?detailsId=SERVICE-5A0CD2879D2F37BE&perspective=performance&problemId={{PROBLEM_ID}}&tf={{TIMEFRAME_FROM}}%3B{{TIMEFRAME_TO}}

  - id: the-slow-trace
    peak_moment: true
    objective: >
      User sees one slow image request end to end: where the seconds go, and what is not slow.
    evidence:
      - queries/beat-04-slowest-invocations.dql
    chained_evidence:
      - query: queries/beat-04-trace-waterfall.dql
        depends_on: queries/beat-04-slowest-invocations.dql
        extract_field: trace_id
        var_name: TRACE_ID
    reveal: >
      The slowest invocations are not marked failed — this is pure latency, not an error. In the
      trace, the DynamoDB lookup and the S3 "check if image for screen size exists" take
      milliseconds, then "Resize original product image" takes almost the whole request: the
      resize itself plus writing the result back to S3. The check for an existing image runs and
      the resize happens anyway — the cache stopped short-circuiting. Say that as the read, and
      point at beat 2's commit for the code-level confirmation; don't state what the diff
      contains.

      Don't claim there are no errors anywhere. On some days the service also shows a single
      sampled failed GET span whose exception is a throttle ("SlowDown: Please reduce your request
      rate.") after about 7 seconds of retries. If the user asks about errors, query the failing
      spans for the window and quote the exception verbatim; it is a symptom of the resizes, not a
      separate cause.
    success: >
      User names the resize step as where the time goes, or asks why the cache check doesn't
      skip it.
    staging: >
      Two moments: (1) land the finding alone on its own line before any commentary — the resize
      step's duration against the whole invocation's duration; (2) then explain what kind of
      problem it is: latency from work that shouldn't happen on every request, not an error and
      not a slow dependency — DynamoDB answers in milliseconds. Then show the waterfall, condensed
      to 4–5 key rows (render_waterfall.py): the frontend image request, the image-provider
      Lambda, the resize step, and one line for the fast steps (DynamoDB, the S3 check). The
      point isn't the row count — it's that the time budget is almost entirely one avoidable step.
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.distributedtracing/explorer?filter=dt.smartscape.service+%3D+SERVICE-5A0CD2879D2F37BE+AND+endpoint.name+%3D+invoke&tf={{TIMEFRAME_FROM}}%3B{{TIMEFRAME_TO}}

  - id: the-humans
    peak_moment: true
    objective: >
      User understands who actually felt it: real shoppers in many countries waiting seconds for
      product images, each with a session replay of exactly what they saw.
    evidence:
      - queries/beat-05-affected-sessions.dql
    reveal: >
      Real-user sessions across many countries hit image loads of several seconds, and nearly all
      have replay. State the actual session total (sum the sessions column over all rows), the top
      countries, and the worst load time from the query result. This is a different population
      from Davis's affected-user count in beat 1 — label which is which. The point isn't the
      number: every one of those is a recording of a shopper staring at an empty image slot. Don't
      use a 5xx filter for this — the images return 200, so it finds almost nobody.
    success: >
      User asks about the user experience, what customers would have seen, or asks to open a
      session replay.
    staging: >
      Same emotional payoff as the payment-failure session beat. After the numbers, make replay
      concrete: open any recording and see which product images appeared, which stayed blank, and
      whether the shopper waited, scrolled on, or left. Ask the source guide's question — "for a
      front-end problem, what did the user actually see?" — and invite the user to open a replay
      through the deep link. The DQL can't answer that; the replay can.
    deep_link: >
      https://playground.apps.dynatrace.com/ui/apps/dynatrace.error.inspector/error-explorer?tf={{TIMEFRAME_FROM}}%3B{{TIMEFRAME_TO}}&problemId={{PROBLEM_ID}}&perspective=impact&sort=affected_users%3Adescending
