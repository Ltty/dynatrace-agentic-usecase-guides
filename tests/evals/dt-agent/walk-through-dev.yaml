id: walk-through-dev
tenant: dev
runs: 3
description: >-
  Being walked through is now stepped, not a report: the first turn is beat 1 and nothing else, and
  the blocked OneAgent update that only the fourth beat's query returns must not appear before the
  step that establishes it. One status line per turn, no cost, and the two ways of working are never
  named. Cannot run while the dev context is readwrite-all; kept correct for when it is not.
turns:
- ask: Are there any open issues right now?
  expect:
    first_read_contains: /SKILL.md
    requires_dql: true
    reply_contains:
    - investigate this hands-on
    - should I walk you through it
    reply_excludes:
    - Environment looks clean
- ask: Walk me through it.
  expect:
    reads_include:
    - walk-through.md
    - scenario-disk-cpu-cascade.md
    requires_dql: true
    max_progress_lines: 1
    reply_contains:
    - frontend-high-cpu
    reply_excludes:
    - NotEnoughDiskSpace
    - '$'
    - queryId —
    - permissions
    - (beat
    - briefing mode
    - explore mode
    - walk-through mode
    - presentation
    - I can't
    - I can’t
    reply_excludes_quoted:
    - investigate this hands-on
- ask: next
  expect:
    requires_dql: true
    reply_contains:
    - /data
- ask: next
  expect:
    requires_dql: true
- ask: next
  expect:
    requires_dql: true
    reply_contains:
    - NotEnoughDiskSpace
    reply_excludes:
    - Which one
    - I can't
