id: walk-through-dev
tenant: dev
runs: 3
description: The survey closes with the walk-through offer, and taking it opens with the whole story from live data
  (the blocked OneAgent update only the fourth beat's query returns), with one status line, no cost, and without ever
  naming the two ways of working.
turns:
- ask: Are there any open issues right now?
  expect:
    first_read_contains: /SKILL.md
    requires_dql: true
    reply_contains_any:
    - take you through
    - through the whole thing
    reply_excludes:
    - Environment looks clean
- ask: Yes, walk me through it.
  expect:
    reads_include:
    - walk-through.md
    - scenario-disk-cpu-cascade-beats.md
    requires_dql: true
    max_progress_lines: 1
    reply_contains:
    - frontend-high-cpu
    - /data
    - NotEnoughDiskSpace
    reply_excludes:
    - '$'
    - queryId —
    - permissions
    - (beat
    - briefing mode
    - explore mode
    - walk-through mode
    - presentation
    - I can't
    - I can’t
