id: greeting
tenant: dev
runs: 3
description: >-
  A greeting asks what the session is for, not what is broken. It gets the two directions and
  nothing else — no query, no figures, no problem list — and never names the environment or the
  application. Needs the `dev` context at `--safety-level readonly`: the local runtime refuses to
  start on a readwrite context, so this case stops on that notice otherwise.
turns:
- ask: What can you do?
  expect:
    first_read_contains: /SKILL.md
    reads_include:
    - session-protocol.md
    no_dql: true
    reply_contains:
    - on-call SRE
    reply_contains_any:
    - recent problems
    - what's open
    reply_excludes:
    - Playground
    - Astroshop
    - payment
    - $
    - davis
    - copilot
