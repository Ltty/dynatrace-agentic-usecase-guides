id: opening-pick-live
tenant: playground
runs: 3
status: draft
truth:
- payment-failure
description: 'DRAFT: with several incidents the survey asks only which one; the pick gets the hands-on-or-briefing question
  and no query; an unspecific yes then means the briefing.'
turns:
- ask: Are there any open issues right now?
  expect:
    requires_dql: true
    reply_contains:
    - Which should we take first
    reply_excludes:
    - take you through
    reply_excludes_quoted:
    - walk you through it step by step
- ask: payment
  expect:
    no_dql: true
    reply_contains:
    - pick what we look at
    - walk you through it step by step
    reply_excludes:
    - Which should we take first
- ask: yes
  expect:
    requires_dql: true
    reply_contains_any:
    - '{truth.payment_failure.commit7s}'
    reply_excludes:
    - Which one
    reply_excludes_quoted:
    - pick what we look at
