id: layout-tour-bill-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT: the cloud tour's cost track. The first reply, the bill against the target (about 290 words of Reveal),
  has the step layout with a single Next line. The next reply is the track's last step: the step layout, then
  "What we hand over" with the findings block, then "Where that leaves us" in two or three bullets and the way out
  as one line, with no paragraph over three sentences. The route varies (three or four steps before the close),
  so only the last turn asserts the close.
turns:
- ask: How can I take 10% off our cloud bill?
  expect:
    layout: step
    requires_dql: true
    reply_excludes:
    - beat
    - cloud-observability
- ask: go on
  expect:
    layout: step
    requires_dql: true
    reply_excludes:
    - beat
- ask: go on
  expect:
    layout: step
    requires_dql: true
    reply_excludes:
    - beat
- ask: go on
  expect:
    layout: close
    min_headlines: 3
    requires_dql: true
    reply_contains:
    - What we hand over
    - Where that leaves us
    reply_excludes:
    - beat
    - cloud-observability
