id: k8s-tour-cloud-alert-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT. The cloud track's peak, asked directly: the agent follows the EC2 CPU alert to its instance, checks that
  instance against every Kubernetes node, and rules the cluster out from the data. The instance is named as a separate
  machine; the alert is said to be open only if the record is ACTIVE.
turns:
- ask: Why is CPU utilization high on my EC2 instances, and are any of those instances nodes of my Kubernetes clusters?
  expect:
    reads_include:
    - scenario-kubernetes-complexity.md
    requires_dql: true
    reply_contains:
    - cloud-alerts-live-high-cpu-vm
    reply_contains_any:
    - not one of
    - isn't one of
    - is not a node
    - isn't a node
    - not a Kubernetes node
    - none of
    reply_excludes:
    - davis
    - copilot
