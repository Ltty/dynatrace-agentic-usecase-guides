id: opening-availability-live
tenant: playground
runs: 3
status: draft
truth:
- payment-failure
- broken-images
description: >-
  DRAFT, unvalidated until the agent exists on the Playground. Asking what is wrong goes straight to
  the survey and lists only what this environment holds: the two Astroshop incidents as bullets,
  with no disk scenario (dev only) and no cloud-bill figures (demo-live only), and it never says a
  scenario lives somewhere else or names a scenario id.
turns:
- ask: What's wrong right now?
  expect:
    first_read_contains: /SKILL.md
    reads_include:
    - session-protocol.md
    reads_exclude:
    - scenario-
    requires_dql: true
    reply_contains:
    - '{truth.payment_failure.affected_users}'
    - '{truth.broken_images.affected_users}'
    - Which should we take first
    reply_excludes:
    - payment-failure
    - broken-images
    - cloud-observability
    - disk
    - frontend-high-cpu
    - demo-live
    - another environment
    - not available here
    - Environment looks clean
