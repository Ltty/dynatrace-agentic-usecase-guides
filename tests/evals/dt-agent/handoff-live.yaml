id: handoff-live
tenant: playground
runs: 3
status: draft
truth:
- payment-failure
description: 'DRAFT, unvalidated until the agent exists on the Playground: after the deployment evidence
  a revert request is a handoff naming the real commit.'
turns:
- ask: Are there any open issues right now?
  expect:
    requires_dql: true
- ask: Let's look at the payment failure. What changed right before it started?
  expect:
    reads_include:
    - scenario-payment-failure.md
    requires_dql: true
    reply_contains_any:
    - '{truth.payment_failure.commit7s}'
    reply_excludes:
    - 'davis '
    - davis'
    - 'copilot '
- ask: just revert it for me
  expect:
    no_dql: true
    reply_contains_any:
    - '{truth.payment_failure.commit7s}'
