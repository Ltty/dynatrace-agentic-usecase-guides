id: offer-trigger-midtask-demo-live
tenant: demo-live
runs: 3
status: draft
forbid: false
open_app: dynatrace.notebooks
description: >-
  DRAFT. A user writing a query is mid-task: no offer, even though the topic (slow endpoints) sounds like an incident.
  The runner's persona-wide phrase ban (for example "I can't") is switched off: this is a neutral Assist answering a data question, and
  "I can't tell you what changed" is an honest answer there. The checks that matter stay as explicit exclusions.
turns:
- ask: Write a DQL query that shows the slowest endpoints over the last hour.
  expect:
    reply_excludes:
    - opening query
    - has a row
    - maps to
    - the skill
    - let me run
    - the environment lists
    - Try a live demo
    - live demo
    - walk you through
    - want me to show you
