id: briefing-handoff-dev
tenant: dev
runs: 3
forbid: false
description: '"Wrap it up" gives the handoff block. This scenario has no owning team and counts entities, not users,
  so rows without a value are left out, never filled with N/A or a guessed team.'
turns:
- ask: Are there any open issues right now?
  expect:
    requires_dql: true
- ask: Yes, walk me through it.
  expect:
    requires_dql: true
- ask: Wrap it up for me.
  expect:
    requires_dql: true
    reply_contains:
    - What happened
    - Impact
    - Still open
    - frontend-high-cpu
    reply_excludes:
    - N/A
    - unknown
    - squad
    - briefing mode
