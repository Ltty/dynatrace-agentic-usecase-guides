id: offer-trigger-cloudcost-demo-live
tenant: demo-live
runs: 3
status: draft
forbid: false
open_app: dynatrace.launcher
description: >-
  DRAFT. Cloud costs are Assist's own cost analysis, never ours: no offer, no demo or tour file read, nothing of the
  Kubernetes tour even though the question mentions where to save.
  The runner's persona-wide phrase ban (for example "I can't") is switched off: this is a neutral Assist answering a data question, and
  "I can't tell you what changed" is an honest answer there. The checks that matter stay as explicit exclusions.
turns:
- ask: Why are my cloud costs higher this month, and where could I save 10 percent?
  expect:
    reads_exclude:
    - scenario-
    - touring-demo-showcases
    reply_excludes:
    - opening query
    - has a row
    - maps to
    - the skill
    - let me run
    - the environment lists
    - Try a live demo
    - live demo
    - walk you through
    - want me to show you
