id: k8s-tour-resources-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT. The resources track, entered by name. The starved step has two queries, so two turns: the problems on the
  service first, then memory against its limit per container, naming memory (not CPU) as the constraint. The bloated
  step is the third turn: the database reserving many times the CPU it uses, in millicores and never dollars, scoped to
  the app so Dynatrace's own webhook does not take over.
turns:
- ask: Why does easytrade-calculationservice keep getting infrastructure problems? Check CPU and memory against its limits.
  expect:
    reads_include:
    - scenario-kubernetes-complexity.md
    requires_dql: true
    reply_contains:
    - Problems on the calculation service
- ask: next
  expect:
    requires_dql: true
    reply_contains:
    - memory
    - limit
    reply_contains_any:
    - MiB
    - megabyte
    reply_excludes:
    - "$"
- ask: next
  expect:
    requires_dql: true
    reply_contains:
    - easytrade-db
    reply_contains_any:
    - millicore
    - "m of CPU"
    reply_excludes:
    - "$"
    - dynatrace-webhook
    - What we hand over
    - Where that leaves us
