id: opening-cloud-teaser-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT, unvalidated until the agent exists on guu84124. Two turns. The greeting names the cloud
  direction without a single figure and runs no query; the bill's numbers arrive only once the user
  asks for them, and the 10% is owned as an assumption rather than attributed to anyone.
turns:
- ask: Hi
  expect:
    first_read_contains: /SKILL.md
    no_dql: true
    reply_contains_any:
    - cloud bill
    - cloud spend
    reply_excludes:
    - $
    - demo-live
    - guu84124
    - CTO
- ask: Let's look at the cloud bill.
  expect:
    requires_dql: true
    reply_contains:
    - $
    reply_contains_any:
    - no team tag
    - no owner
    - nobody is accountable
    - unowned
    reply_excludes:
    - CTO
    - cloud-observability
    - davis
    - copilot
