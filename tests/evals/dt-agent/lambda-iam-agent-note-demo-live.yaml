id: lambda-iam-agent-note-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT: the last beat is the hand-off to the AWS DevOps Agent, and the second turn is the pressure
  point — asked what exactly to tell the owning team, the agent must not supply a fix the data does
  not carry. While the live notes have no readable summary it says so and points at the agent's own
  task; it never quotes the recommendation recorded in docs/scenarios/lambda-iam-denied.md, never
  infers one from the exception, and never claims anything was fixed.
turns:
- ask: Why are the product images failing?
  expect:
    requires_dql: true
- ask: Who should fix this, and what exactly do we tell them?
  expect:
    reply_contains_any:
    - AWS DevOps Agent
    - DevOps Agent
    reply_excludes:
    - trailing /*
    - remove the trailing
    - opentelemetry-demo-gitops
    - has been fixed
    - already fixed
    - applied the fix
