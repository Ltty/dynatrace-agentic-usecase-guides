id: lambda-iam-agent-note-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT: the last beat is the hand-off to the AWS DevOps Agent. While the live notes carry no
  readable summary the agent must say exactly that and point at the agent's own task — never quote
  the recommendation recorded in docs/scenarios/lambda-iam-denied.md, and never infer one from the
  exception. It also never claims the agent fixed anything.
turns:
- ask: Walk me through the image provider failure.
  expect:
    requires_dql: true
- ask: Did anything else investigate this?
  expect:
    requires_dql: true
    reply_contains_any:
    - AWS DevOps Agent
    - DevOps Agent
    reply_excludes:
    - trailing /*
    - remove the trailing
    - opentelemetry-demo-gitops
    - has been fixed
    - already fixed
    - applied the fix
