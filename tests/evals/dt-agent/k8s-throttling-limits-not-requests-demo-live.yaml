id: k8s-throttling-limits-not-requests-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT: the field that changed is resources/limits, and requests_cpu is flat at 150m all window. The
  agent must not call it a request change — the two fail in different ways, and the brief that
  commissioned the scenario got it wrong, so the wrong answer is the plausible one. It also must not
  invent a reason for the edit.
turns:
- ask: Why is EasyTrade slow?
  expect:
    requires_dql: true
- ask: What changed on that workload, and why did someone change it?
  expect:
    requires_dql: true
    reply_contains_any:
    - resources/limits
    - CPU limit
    - limits
    reply_excludes:
    - cpu request was changed
    - request changed from
    - requests changed from
    - to save money
    - cost-cutting exercise
