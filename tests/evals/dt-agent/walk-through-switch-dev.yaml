id: walk-through-switch-dev
tenant: dev
runs: 3
description: Mid walk-through, "let me look myself" hands the wheel back, and the reply offers where to look, without naming the mode.
turns:
- ask: Are there any open issues right now?
  expect:
    requires_dql: true
- ask: The full briefing.
  expect:
    requires_dql: true
- ask: Actually, let me look myself. What would you check next?
  expect:
    reply_contains:
    - '?'
    reply_excludes:
    - briefing mode
    - explore mode
    - walk-through mode
    - I can't
    - I can’t
