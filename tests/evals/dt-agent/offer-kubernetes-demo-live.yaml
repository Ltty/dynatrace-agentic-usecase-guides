id: offer-kubernetes-demo-live
tenant: demo-live
runs: 3
status: draft
open_app: dynatrace.kubernetes
description: >-
  DRAFT: in the Kubernetes app on the environment that lists the Kubernetes tour, the offer is the tour, not the
  EasyTrade slowdown on its own: the tour's troubleshoot track is that incident, so offering both would ask the user
  to choose the same story twice. No figure in the offer; a yes starts the tour's Opening, which ends on its question.
turns:
- ask: What can I do here?
  expect:
    reads_include:
    - offering-live-demos/SKILL.md
    requires_dql: true
    max_dql_calls: 1
    max_progress_lines: 0
    reply_contains:
    - Try a live demo
    - real Kubernetes data
    - wasted or starved
    - want me to
    - opening query
    - has a row
    - maps to
    - the skill
    - k8s-cpu-throttling
    - kubernetes-complexity
    - resource limits, and what the troubleshooting agent
    - playground
    - demo-live
    - "$"
- ask: Yes, show me.
  expect:
    reads_include:
    - touring-demo-showcases/SKILL.md
    - scenario-kubernetes-complexity.md
    requires_dql: true
    reply_contains:
    - hurts most
    reply_contains_any:
    - EKS
    - eks-live
    reply_excludes_quoted:
    - investigate this hands-on
