id: cloud-tour-opening-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT. A showcase is a presentation, not a choice of format: picking the cloud tour starts its
  first step rather than asking how to run it. No mode question, no survey, no incident list, and
  the turn ends on a call to action.
  The turn says what the tour is before its first table: that it is a guided tour, that it ends at the
  bill, and how to move on. "Challenge" is the author's word and is never spoken.
turns:
- ask: Show me the cloud tour.
  expect:
    first_read_contains: /SKILL.md
    reads_include:
    - scenario-cloud-observability.md
    - touring-cloud-observability/SKILL.md
    requires_dql: true
    reply_contains:
    - bill
    - tour
    - AWS
    reply_contains_any:
    - say next
    - Say next
    - ask about anything
    reply_excludes:
    - challenge
    - whole tour
    - Which should we take first
    - account team
    - davis
    - copilot
    reply_excludes_quoted:
    - investigate this hands-on
    - should I walk you through it
