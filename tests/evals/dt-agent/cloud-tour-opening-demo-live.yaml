id: cloud-tour-opening-demo-live
tenant: demo-live
runs: 3
status: draft
description: >-
  DRAFT. A showcase is a presentation, not a choice of format: picking the cloud tour starts its
  first step rather than asking how to run it. No mode question, no survey, no incident list, and
  the turn ends on a call to action.
  The turn states the job before its first table, as a labelled premise (take 10% off the bill without
  breaking anything), then the route to the bill and how to move on. "Challenge" is the author's word and
  is never spoken, and the premise is never attributed to a CTO or finance.
turns:
- ask: Show me the cloud tour.
  expect:
    first_read_contains: /SKILL.md
    reads_include:
    - scenario-cloud-observability.md
    - touring-cloud-observability/SKILL.md
    requires_dql: true
    reply_contains:
    - 10%
    - without breaking anything
    - bill
    - AWS
    reply_contains_any:
    - say next
    - Say next
    - ask about anything
    reply_excludes:
    - challenge
    - your CTO
    - finance wants
    - the CTO
    - whole tour
    - Which should we take first
    - account team
    - davis
    - copilot
    reply_excludes_quoted:
    - investigate this hands-on
    - should I walk you through it
